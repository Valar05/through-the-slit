name: release-gate

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run build:itch
      - name: Upload itch release artifact
        uses: actions/upload-artifact@v4
        with:
          name: through-the-slit-${{ github.sha }}-dist-itch
          path: dist-itch
          if-no-files-found: error
          retention-days: 7
      - run: npm run build:crazygames
      - name: Upload CrazyGames release artifact
        uses: actions/upload-artifact@v4
        with:
          name: through-the-slit-${{ github.sha }}-dist-crazygames
          path: dist-crazygames
          if-no-files-found: error
          retention-days: 7
      - run: npm run lint -- --ignore-pattern dist-itch --ignore-pattern dist-crazygames
