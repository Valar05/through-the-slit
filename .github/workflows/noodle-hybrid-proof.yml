name: Noodle Hybrid Proof

on:
  push:
    branches:
      - art/noodle-hybrid-v0
    paths:
      - 'evidence/noodle-hybrid-v0/**'
      - '.github/workflows/noodle-hybrid-proof.yml'
  pull_request:
    paths:
      - 'evidence/noodle-hybrid-v0/**'
      - '.github/workflows/noodle-hybrid-proof.yml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify hybrid style and corpus invariants
        run: node evidence/noodle-hybrid-v0/verify.mjs
